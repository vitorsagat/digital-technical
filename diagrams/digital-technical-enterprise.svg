<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DIGITAL TECHNICAL enterprise architecture</title>
  <desc id="desc">Layered cloud-agnostic and AI-agnostic architecture showing channels, application core, adapters, providers, security, observability, and delivery automation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#142033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #132238; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #53657b; }
      .band-title { font: 700 16px Inter, Arial, sans-serif; fill: #1d3049; }
      .box-title { font: 700 15px Inter, Arial, sans-serif; fill: #15263c; }
      .box-copy { font: 400 12px Inter, Arial, sans-serif; fill: #53657b; }
      .small { font: 600 11px Inter, Arial, sans-serif; fill: #60748b; }
      .line { stroke: #52647a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #75869a; stroke-width: 1.6; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f5f8fb"/>
  <rect x="0" y="0" width="1600" height="102" fill="#ffffff"/>
  <rect x="0" y="99" width="1600" height="3" fill="#e43f34"/>
  <text x="62" y="48" class="title">DIGITAL TECHNICAL</text>
  <text x="62" y="77" class="subtitle">Provider-independent technical advisory platform | enterprise reference architecture</text>
  <rect x="1262" y="28" width="276" height="42" rx="6" fill="#132238"/>
  <text x="1400" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">CLOUD-AGNOSTIC + AI-AGNOSTIC</text>

  <rect x="48" y="130" width="1504" height="104" rx="8" fill="#eaf1f8" stroke="#c6d4e2"/>
  <text x="70" y="157" class="band-title">1. EXPERIENCE &amp; INTEGRATION CHANNELS</text>
  <g filter="url(#shadow)">
    <rect x="82" y="174" width="240" height="42" rx="6" fill="#ffffff"/>
    <rect x="356" y="174" width="240" height="42" rx="6" fill="#ffffff"/>
    <rect x="630" y="174" width="240" height="42" rx="6" fill="#ffffff"/>
    <rect x="904" y="174" width="240" height="42" rx="6" fill="#ffffff"/>
    <rect x="1178" y="174" width="292" height="42" rx="6" fill="#ffffff"/>
  </g>
  <text x="202" y="200" text-anchor="middle" class="box-title">Web / Corporate Portal</text>
  <text x="476" y="200" text-anchor="middle" class="box-title">REST API / Automation</text>
  <text x="750" y="200" text-anchor="middle" class="box-title">Microsoft 365 / Graph</text>
  <text x="1024" y="200" text-anchor="middle" class="box-title">ITSM / Approval</text>
  <text x="1324" y="200" text-anchor="middle" class="box-title">CLI, Events &amp; External Systems</text>

  <path d="M800 234 L800 270" class="line"/>
  <rect x="48" y="270" width="1504" height="110" rx="8" fill="#ffffff" stroke="#c8d4df"/>
  <text x="70" y="298" class="band-title">2. API &amp; APPLICATION SERVICES</text>
  <rect x="82" y="318" width="280" height="44" rx="6" fill="#163f69"/>
  <rect x="390" y="318" width="250" height="44" rx="6" fill="#1e6b73"/>
  <rect x="668" y="318" width="250" height="44" rx="6" fill="#3a6b45"/>
  <rect x="946" y="318" width="250" height="44" rx="6" fill="#805f22"/>
  <rect x="1224" y="318" width="246" height="44" rx="6" fill="#6a4678"/>
  <text x="222" y="345" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">FastAPI + OpenAPI</text>
  <text x="515" y="345" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Authentication &amp; Policy</text>
  <text x="793" y="345" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Advisor Service</text>
  <text x="1071" y="345" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Human Review Gate</text>
  <text x="1347" y="345" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Workflow / Agents</text>

  <path d="M800 380 L800 412" class="line"/>
  <rect x="48" y="412" width="1504" height="150" rx="8" fill="#eef8f3" stroke="#b9d9c8"/>
  <text x="70" y="440" class="band-title">3. PROVIDER-INDEPENDENT BUSINESS CORE</text>
  <rect x="88" y="462" width="330" height="72" rx="6" fill="#ffffff" stroke="#9ec7b0" filter="url(#shadow)"/>
  <rect x="454" y="462" width="330" height="72" rx="6" fill="#ffffff" stroke="#9ec7b0" filter="url(#shadow)"/>
  <rect x="820" y="462" width="330" height="72" rx="6" fill="#ffffff" stroke="#9ec7b0" filter="url(#shadow)"/>
  <rect x="1186" y="462" width="278" height="72" rx="6" fill="#ffffff" stroke="#9ec7b0" filter="url(#shadow)"/>
  <text x="253" y="489" text-anchor="middle" class="box-title">Request Lifecycle</text>
  <text x="253" y="512" text-anchor="middle" class="box-copy">status, criticality, idempotency</text>
  <text x="619" y="489" text-anchor="middle" class="box-title">Knowledge &amp; Citation Rules</text>
  <text x="619" y="512" text-anchor="middle" class="box-copy">approved evidence only</text>
  <text x="985" y="489" text-anchor="middle" class="box-title">Safety &amp; Decision Policy</text>
  <text x="985" y="512" text-anchor="middle" class="box-copy">facts, assumptions, escalation</text>
  <text x="1325" y="489" text-anchor="middle" class="box-title">Domain Events</text>
  <text x="1325" y="512" text-anchor="middle" class="box-copy">received, completed, review</text>

  <path d="M800 562 L800 596" class="line"/>
  <rect x="48" y="596" width="1504" height="142" rx="8" fill="#fff8eb" stroke="#e2cca0"/>
  <text x="70" y="624" class="band-title">4. PORTS &amp; PROVIDER ADAPTERS</text>
  <g filter="url(#shadow)">
    <rect x="82" y="647" width="250" height="66" rx="6" fill="#ffffff"/>
    <rect x="365" y="647" width="250" height="66" rx="6" fill="#ffffff"/>
    <rect x="648" y="647" width="250" height="66" rx="6" fill="#ffffff"/>
    <rect x="931" y="647" width="250" height="66" rx="6" fill="#ffffff"/>
    <rect x="1214" y="647" width="256" height="66" rx="6" fill="#ffffff"/>
  </g>
  <text x="207" y="675" text-anchor="middle" class="box-title">AI Provider Port</text>
  <text x="207" y="697" text-anchor="middle" class="box-copy">deterministic / compatible API</text>
  <text x="490" y="675" text-anchor="middle" class="box-title">Knowledge Port</text>
  <text x="490" y="697" text-anchor="middle" class="box-copy">JSON / RAG / vector search</text>
  <text x="773" y="675" text-anchor="middle" class="box-title">Repository Port</text>
  <text x="773" y="697" text-anchor="middle" class="box-copy">SQLite / SQL / NoSQL</text>
  <text x="1056" y="675" text-anchor="middle" class="box-title">Event &amp; Storage Ports</text>
  <text x="1056" y="697" text-anchor="middle" class="box-copy">queue / pub-sub / objects</text>
  <text x="1342" y="675" text-anchor="middle" class="box-title">Identity &amp; Observability</text>
  <text x="1342" y="697" text-anchor="middle" class="box-copy">IAM / logs / metrics / traces</text>

  <path d="M800 738 L800 772" class="line"/>
  <rect x="48" y="772" width="1504" height="118" rx="8" fill="#f1eff8" stroke="#ccc4dd"/>
  <text x="70" y="800" class="band-title">5. CLOUD &amp; AI PROVIDERS</text>
  <rect x="82" y="823" width="164" height="42" rx="6" fill="#c74634"/>
  <rect x="266" y="823" width="164" height="42" rx="6" fill="#ff9900"/>
  <rect x="450" y="823" width="164" height="42" rx="6" fill="#1473e6"/>
  <rect x="634" y="823" width="164" height="42" rx="6" fill="#4285f4"/>
  <rect x="826" y="823" width="210" height="42" rx="6" fill="#222b38"/>
  <rect x="1056" y="823" width="188" height="42" rx="6" fill="#385d46"/>
  <rect x="1264" y="823" width="206" height="42" rx="6" fill="#71558a"/>
  <text x="164" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">OCI</text>
  <text x="348" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">AWS</text>
  <text x="532" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Azure</text>
  <text x="716" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">GCP</text>
  <text x="931" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">OpenAI-compatible</text>
  <text x="1150" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">OCI / Google AI</text>
  <text x="1367" y="849" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Open-source Models</text>

  <rect x="48" y="916" width="1504" height="50" rx="8" fill="#17283d"/>
  <text x="70" y="946" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">DELIVERY &amp; GOVERNANCE</text>
  <text x="300" y="946" class="small" fill="#d6e1ec">GitHub Actions</text>
  <text x="445" y="946" class="small" fill="#d6e1ec">Terraform modules</text>
  <text x="620" y="946" class="small" fill="#d6e1ec">Secrets manager</text>
  <text x="790" y="946" class="small" fill="#d6e1ec">Policy as code</text>
  <text x="940" y="946" class="small" fill="#d6e1ec">Image scanning</text>
  <text x="1090" y="946" class="small" fill="#d6e1ec">Audit trail</text>
  <text x="1220" y="946" class="small" fill="#d6e1ec">SLOs &amp; alerts</text>
  <text x="1380" y="946" class="small" fill="#d6e1ec">dev → production</text>
</svg>
